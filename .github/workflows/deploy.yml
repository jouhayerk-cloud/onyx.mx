name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          npm install
          npm run build
        # Vite only inlines variables prefixed VITE_. Anything without that prefix
        # is invisible to the bundle, which is why the Gemini key was undefined in
        # every deployed build despite the secret being set.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_CYPHER_KEY: ${{ secrets.VITE_CYPHER_KEY }}
          VITE_GOOGLE_SHEETS_WEBHOOK: ${{ secrets.VITE_GOOGLE_SHEETS_WEBHOOK }}
          VITE_SUPABASE_OFFLINE_KEY: ${{ secrets.VITE_SUPABASE_OFFLINE_KEY }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
