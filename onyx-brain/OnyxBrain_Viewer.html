<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnyxBrain | Visual Knowledge Repository</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
    <script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
    <script src="https://unpkg.com/lucide@0.447.0/dist/umd/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap');
        
        :root {
            --onyx-cyan: #00f2ff;
            --onyx-magenta: #ff00ea;
            --onyx-green: #00ff41;
            --bg-dark: #0a0a0f;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
        }

        .glass {
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neo-cyan { text-shadow: 0 0 10px var(--onyx-cyan); }
        .neo-magenta { text-shadow: 0 0 10px var(--onyx-magenta); }

        #graph-container {
            width: 100vw;
            height: 100vh;
        }

        .sidebar {
            width: 400px;
            transition: transform 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="graph-container"></div>

    <!-- UI Overlay -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none flex">
        
        <!-- Left Sidebar: Node Inspector -->
        <div id="inspector" class="sidebar p-6 glass m-4 rounded-2xl pointer-events-auto flex flex-col gap-6">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold tracking-tighter flex items-center gap-2">
                    <i data-lucide="brain" class="text-cyan-400"></i>
                    ONYX<span class="text-cyan-400">BRAIN</span>
                </h1>
                <button class="text-zinc-500 hover:text-white transition-colors">
                    <i data-lucide="settings-2" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Search Area -->
            <div class="space-y-4">
                <div class="relative">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-zinc-500"></i>
                    <input type="text" id="search-box" placeholder="Search keywords (e.g. Supabase, React)..." 
                        class="w-full bg-white/5 border border-white/10 rounded-lg py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-1 focus:ring-cyan-500 transition-all">
                </div>
                <div id="search-stats" class="hidden flex items-center justify-between px-1">
                    <span class="text-[10px] text-zinc-500 uppercase font-bold tracking-widest"><span id="match-count">0</span> Results Found</span>
                    <button id="export-results" class="flex items-center gap-1 text-[10px] text-cyan-400 hover:text-cyan-300 transition-colors uppercase font-bold tracking-widest">
                        <i data-lucide="download" class="w-3 h-3"></i>
                        Export Digest
                    </button>
                </div>
            </div>

            <div id="node-details" class="flex-1 overflow-y-auto scrollbar-hide space-y-4">
                <div class="p-8 text-center text-zinc-500 italic mt-10">
                    <i data-lucide="mouse-pointer-2" class="w-12 h-12 mx-auto mb-4 opacity-20"></i>
                    Select a data point in the 3D map to extract granular knowledge.
                </div>
            </div>

            <!-- Prompt Generator Area -->
            <div class="border-t border-white/10 pt-4">
                <h3 class="text-sm font-semibold uppercase tracking-widest text-zinc-400 mb-3">Prompt Generator</h3>
                <div class="flex gap-2">
                    <button id="gen-prompt" class="flex-1 bg-cyan-600/20 hover:bg-cyan-600/40 text-cyan-400 py-2 rounded-lg border border-cyan-500/30 font-medium transition-all">
                        Generate Context JSON
                    </button>
                    <button class="p-2 border border-white/10 rounded-lg hover:bg-white/5 transition-colors">
                        <i data-lucide="download" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Side: Legend & Stats -->
        <div class="flex-1 flex flex-col items-end p-6 pointer-events-none">
            <div class="glass p-4 rounded-xl pointer-events-auto flex flex-col gap-3 text-[10px] uppercase font-bold tracking-widest text-zinc-400">
                <div class="grid grid-cols-2 gap-x-6 gap-y-2">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-cyan-400"></div> Component
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-red-600"></div> Database
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-yellow-500"></div> Codebase
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-emerald-400"></div> Element
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-zinc-500"></div> General
                    </div>
                    <div class="flex items-baseline gap-2 pt-1 border-t border-white/10 mt-1 col-span-2">
                        <div class="w-2 h-2 rounded-full bg-fuchsia-500"></div> Artifact
                    </div>
                </div>
            </div>

            <div class="mt-auto glass p-6 rounded-2xl pointer-events-auto max-w-sm">
                <div class="flex items-center gap-4 mb-4">
                    <div class="p-3 bg-cyan-500/10 rounded-lg">
                        <i data-lucide="activity" class="text-cyan-400"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-lg">Brain Repository</h4>
                        <p class="text-xs text-zinc-500">Local Knowledge Index v1.0.0</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-3 rounded-xl bg-white/5">
                        <span class="block text-2xl font-bold neo-cyan">38</span>
                        <span class="text-[10px] text-zinc-500 uppercase">Sessions</span>
                    </div>
                    <div class="p-3 rounded-xl bg-white/5">
                        <span class="block text-2xl font-bold neo-magenta">241</span>
                        <span class="text-[10px] text-zinc-500 uppercase">Data Points</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DATA_INJECTION_POINT
        const gData = window.ONYX_DATA || { // Fallback to sample data
            nodes: [
                { id: 'ca5bd05d', label: 'Session ca5bd0', group: 'conversation', color: '#22d3ee' },
                { id: 'c1e154f6', label: 'Session c1e154', group: 'conversation', color: '#22d3ee' },
                { id: '1ed5430e', label: 'Session 1ed543', group: 'conversation', color: '#22d3ee' },
                { id: 'art-1', label: 'Studio Modernization Plan', group: 'artifact', color: '#d946ef', summary: 'Phase 1 of Studio Modernization: Standardizing on the TALAN theme.' },
                { id: 'art-2', label: 'AR Integration Report', group: 'artifact', color: '#d946ef', summary: 'Technical requirements for AR and market standards.' },
                { id: 'media-1', label: 'UI_Mockup_v2.png', group: 'media', color: '#34d399' },
                { id: 'media-2', label: 'Dashboard_Final.webp', group: 'media', color: '#34d399' }
            ],
            links: [
                { source: 'ca5bd05d', target: 'art-1' },
                { source: 'c1e154f6', target: 'art-2' },
                { source: 'c1e154f6', target: 'media-1' },
                { source: '1ed5430e', target: 'media-2' },
                { source: 'ca5bd05d', target: 'c1e154f6' }
            ]
        };

        const categoryColors = {
            DATABASE: '#ff0000',   // Red
            CODEBASE: '#ffd700',   // Gold
            COMPONENTS: '#00f2ff', // Cyan
            ELEMENTS: '#00ff41',   // Green
            GENERAL: '#a1a1aa'     // Zinc
        };

        const Graph = ForceGraph3D()
          (document.getElementById('graph-container'))
            .nodeLabel(node => `${node.label} [${node.category || node.group}]`)
            .nodeColor(node => {
                if (node.group === 'keyword') return 'rgba(255,255,255,0)'; // Invisible Magnet
                if (node.group === 'conversation') return categoryColors[node.category] || '#22d3ee';
                if (node.group === 'artifact') return '#d946ef';
                if (node.group === 'media') return '#34d399';
                return '#ffffff';
            })
            .nodeRelSize(5)
            .linkColor(() => 'rgba(255,255,255,0.05)')
            .onNodeClick(node => {
                updateInspector(node);
                const distance = 40;
                const distRatio = 1 + distance/Math.hypot(node.x, node.y, node.z);
                Graph.cameraPosition(
                    { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                    node,
                    2000
                );
            })
            .nodeThreeObject(node => {
                if (node.group === 'conversation') return null;
                if (node.group === 'keyword') return new THREE.Object3D();

                if (node.group === 'artifact') {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const title = node.label.length > 25 ? node.label.substring(0, 22) + '...' : node.label;
                    const snippet = node.summary ? (node.summary.length > 40 ? node.summary.substring(0, 37) + '...' : node.summary) : '';
                    
                    canvas.width = 400;
                    canvas.height = 100;
                    
                    // Glassmorphic Pill background
                    ctx.fillStyle = 'rgba(217, 70, 239, 0.2)';
                    ctx.roundRect(0, 0, 400, 100, 20);
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#d946ef';
                    ctx.stroke();

                    // Text
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 36px sans-serif';
                    ctx.fillText(title, 20, 50);
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.font = '24px sans-serif';
                    ctx.fillText(snippet, 20, 85);
                    
                    const texture = new THREE.CanvasTexture(canvas);
                    const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
                    const sprite = new THREE.Sprite(spriteMaterial);
                    sprite.scale.set(16, 4, 1);
                    return sprite;
                }

                if (node.group === 'media' && node.img) {
                    const texture = new THREE.TextureLoader().load(node.img);
                    const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
                    const sprite = new THREE.Sprite(spriteMaterial);
                    sprite.scale.set(15, 15, 1);
                    return sprite;
                }
                return null;
            })
            .graphData(gData);

        // Group-based Link Coloring
        Graph.linkDirectionalParticles(2)
             .linkDirectionalParticleWidth(0.5)
             .linkColor(link => {
                 const sourceNode = gData.nodes.find(n => n.id === link.source.id || n.id === link.source);
                 if (!sourceNode) return 'rgba(255,255,255,0.1)';
                 if (sourceNode.group === 'conversation') {
                     const cat = sourceNode.category;
                     if (cat === 'DATABASE') return '#ef4444';
                     if (cat === 'CODEBASE') return '#fbbf24';
                     if (cat === 'COMPONENTS') return '#3b82f6';
                     if (cat === 'ELEMENTS') return '#10b981';
                 }
                 return 'rgba(255,255,255,0.05)';
             });

        function updateInspector(node) {
            const container = document.getElementById('node-details');
            const categoryBadge = node.category ? `
                <div class="px-2 py-0.5 rounded-md text-[9px] font-bold border border-white/20 bg-white/5 text-zinc-300 inline-block uppercase tracking-tighter">
                    ${node.category}
                </div>
            ` : '';

            let content = `
                <div class="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div class="flex items-center gap-2">
                        <div class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest inline-block" style="background: ${categoryColors[node.category] || '#22d3ee'}33; color: ${categoryColors[node.category] || '#22d3ee'}">
                            ${node.group}
                        </div>
                        ${categoryBadge}
                    </div>
                    
                    <div>
                        <h2 class="text-3xl font-bold tracking-tighter border-b border-white/10 pb-2 mb-2">${node.label}</h2>
                        <p class="text-zinc-500 font-mono text-[10px] opacity-50 break-all">${node.id}</p>
                    </div>
                    
                    ${node.img ? `
                        <div class="overflow-hidden rounded-2xl border border-white/20 shadow-2xl">
                            <img src="${node.img}" class="w-full h-auto object-cover transform hover:scale-110 transition-transform duration-700" />
                        </div>
                    ` : ''}

                    ${node.summary ? `
                        <div class="p-5 rounded-2xl glass border border-white/10 shadow-lg">
                            <h4 class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                <i data-lucide="file-text" class="w-3 h-3 text-magenta-400"></i>
                                Knowledge Summary
                            </h4>
                            <p class="text-sm leading-relaxed text-zinc-200 mb-4">${node.summary}</p>
                            
                            ${node.content ? `
                                <div class="mt-4 pt-4 border-t border-white/10">
                                    <h4 class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                        <i data-lucide="code" class="w-3 h-3 text-cyan-400"></i>
                                        Baked Content
                                    </h4>
                                    <pre class="p-3 rounded-lg bg-black/40 border border-white/10 font-mono text-[11px] text-cyan-200/80 overflow-x-auto whitespace-pre-wrap max-h-48 overflow-y-auto">${node.content}</pre>
                                </div>
                            ` : ''}
                        </div>
                    ` : ''}

                    ${node.keywords && node.keywords.length > 0 ? `
                        <div class="p-5 rounded-2xl glass border border-white/10">
                            <div class="flex items-center justify-between mb-4">
                                <h4 class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest flex items-center gap-2">
                                    <i data-lucide="fingerprint" class="w-3 h-3 text-magenta-400"></i>
                                    Protobuf Keywords
                                </h4>
                                <div class="group relative">
                                    <i data-lucide="info" class="w-3 h-3 text-zinc-600 cursor-help"></i>
                                    <div class="absolute right-0 bottom-full mb-2 w-48 p-2 glass rounded-lg text-[9px] scale-0 group-hover:scale-100 transition-transform origin-bottom-right shadow-2xl z-50">
                                        These technical tags are extracted directly from binary session transcripts using a heuristic ASCII miner for deep context recall.
                                    </div>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${node.keywords.map(kw => `
                                    <span class="px-3 py-1 rounded-md bg-white/5 border border-white/5 text-[10px] text-zinc-300 hover:border-cyan-500/50 transition-colors cursor-default">${kw}</span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-4 glass rounded-2xl border border-white/5 text-center">
                            <span class="block text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Status</span>
                            <span class="font-bold text-cyan-400 text-sm">PRO SYNC</span>
                        </div>
                        <div class="p-4 glass rounded-2xl border border-white/5 text-center">
                            <span class="block text-[10px] text-zinc-500 uppercase tracking-widest mb-1">Type</span>
                            <span class="font-bold text-zinc-300 text-sm">MULTIMEDIA</span>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = content;
            lucide.createIcons(); // Re-initialize icons for the new content
        }

        // Search & Reformulation Implementation
        const searchBox = document.getElementById('search-box');
        const searchStats = document.getElementById('search-stats');
        const matchCount = document.getElementById('match-count');
        let currentMatches = [];

        searchBox.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            
            if(!val) {
                searchStats.classList.add('hidden');
                currentMatches = [];
                
                // Reset Visuals
                Graph.nodeColor(node => node.group === 'conversation' ? (categoryColors[node.category] || node.color) : node.color);
                
                // Reset Physics: Remove radial focus
                Graph.d3Force('radial', null);
                Graph.d3ReheatSimulation();
                return;
            }

            // identify matches
            currentMatches = gData.nodes.filter(node => {
                const matchesName = node.label.toLowerCase().includes(val);
                const matchesCategory = node.category && node.category.toLowerCase().includes(val);
                const matchesKW = node.keywords && node.keywords.some(k => k.toLowerCase().includes(val));
                const matchesContent = node.content && node.content.toLowerCase().includes(val);
                return matchesName || matchesCategory || matchesKW || matchesContent;
            });

            // Update UI
            searchStats.classList.remove('hidden');
            matchCount.textContent = currentMatches.length;

            // visual highlight and background fading
            Graph.nodeColor(node => {
                const isMatch = currentMatches.some(m => m.id === node.id);
                if (isMatch) return categoryColors[node.category] || node.color || '#00f2ff';
                return 'rgba(255,255,255,0.02)'; // Ultra-faded background
            });

            // Physics Reformulation: Radial Cluster at center
            Graph.d3Force('radial', d3.forceRadial(0).strength(node => {
                return currentMatches.some(m => m.id === node.id) ? 1.5 : 0.1;
            }));
            
            Graph.d3ReheatSimulation();
        });

        // Export System
        document.getElementById('export-results').addEventListener('click', () => {
            if (currentMatches.length === 0) return;

            const digest = currentMatches.map(n => `
## ${n.label} [${n.group.toUpperCase()}]
**Category:** ${n.category || 'N/A'}
**Summary:** ${n.summary || 'None'}
**Content Snippet:**
${n.content || 'No text content baked.'}
---
`).join('\n');

            const blob = new Blob([digest], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `OnyxBrain_Search_Digest_${new Date().getTime()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Data Loading Logic
        if (window.ONYX_DATA) {
            console.log("OnyxBrain: Using injected standalone data.");
            Graph.graphData(window.ONYX_DATA);
        } else {
            console.log("OnyxBrain: No injected data found. Attempting to fetch brain_data.json...");
            fetch('./brain_data.json')
                .then(res => res.json())
                .then(data => {
                    Graph.graphData(data);
                })
                .catch(err => {
                    console.log("Using sample data, no local brain_data.json found. Run miner.js first.");
                });
        }

        document.getElementById('gen-prompt').addEventListener('click', () => {
             const json = JSON.stringify({
                context: "OnyxBrain Injection",
                timestamp: new Date().toISOString(),
                targets: gData.nodes.filter(n => n.group === 'artifact').map(n => ({ id: n.id, summary: n.summary }))
             }, null, 2);
             console.log("Generated Prompt JSON:", json);
             alert("JSON Context Prompt generated to console. Follow the integration steps in README to copy to clipboard automatically.");
        });

        lucide.createIcons();
    </script>
</body>
</html>
