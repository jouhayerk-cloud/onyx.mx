  <!-- viewport-fit=cover: the layout extends under the notch and the home
       indicator on iOS, so content scrolls behind the translucent top bar
       instead of stopping at a letterboxed edge. It is what makes the
       env(safe-area-inset-*) values non-zero; without it they are all 0 and
       the padding rules that read them do nothing. Anything that must stay
       tappable pays that inset back in CSS — see index.css. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- iOS standalone (Home Screen) is a SEPARATE gate from viewport-fit=cover,
       and it is the one that was missing. Installed to the Home Screen, iOS
       reserves the status-bar strip and fills it with theme-color unless the
       style is black-translucent; in that reserved mode env(safe-area-inset-top)
       also resolves to 0, so every safe-area rule in index.css is inert and the
       top bar stops dead below an opaque band. black-translucent hands the full
       display to the web view: the bar's glass runs under the clock and the
       inventory scrolls behind it.

       Cost of the mode, deliberately accepted: iOS then draws the status-bar
       glyphs WHITE and offers no way to ask for dark ones. On the light Aqua
       slab the clock sits on pale glass. The alternative is the opaque band. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

       vite.config.ts, the one place to bump with every icon redesign: browsers
       and iOS cache icons by URL, so an unchanged URL keeps serving the old cube.
       The PNG comes first with sizes and the SVG last with its type, so
       browsers that draw SVG favicons (Chrome, Firefox) take the theme-aware
       SVG and Safari, which does not, falls back to the PNG. -->
  <link rel="icon" type="image/png" sizes="64x64" href="/onyx.mx/favicon.png?v=1.87" />
  <link rel="icon" type="image/png" sizes="192x192" href="/onyx.mx/icon-192.png?v=1.87" />

  <!-- sizes is not decoration: with several apple-touch-icon links iOS picks
       by declared size, and an undeclared one is treated as 60x60 — the
       lowest-priority candidate. 180x180 is the largest iOS uses for the Home
       Screen (60pt @3x); it downscales for iPad's 152/167.
       Light / dark pair: iOS takes a web app's icon ONCE, at Add to Home
       Screen, and never swaps it when the phone changes appearance — there is
       no web API for a live dark icon. The media queries choose the variant
       that matches the appearance at install time: the glass cube (light) or
       the abalone cube (dark). The dark one is declared last so that a Safari
       which ignores media still lands on the abalone render. -->
  <link rel="apple-touch-icon" sizes="180x180" media="(prefers-color-scheme: light)" href="/onyx.mx/apple-touch-icon.png?v=1.87" />

       stale cache (an old index.html that points at JS or CSS chunks a newer
       deploy deleted), so the app can never mount. Only a REAL load failure of
       a same-origin script or stylesheet, or of a lazy chunk, may unregister the
       service worker and wipe the caches, and only once per build (2.0.0-mvr3dkhi).

       What it must never do: act on a timer alone. On a slow phone or a weak
       signal the 2.4 MB main chunk can take longer than any fixed timeout, and
       wiping the precache there throws away the offline copy for nothing. The
       timers below only change the splash text and offer a plain reload. It
       also never wipes while the device is offline: nothing could be refetched. */

      var HEAL_KEY = 'onyx_healed_build';

        if (readHealed() === BUILD) return true;
        // No usable storage at all: the ?v= added by our own reload is the only memory left.
        if (!ls && !ss) { try { return new URL(location.href).searchParams.has('v'); } catch (e) {} }

      try { var lang = ls && ls.getItem('appLanguage'); es = lang ? JSON.parse(lang) === 'es' : /^es/i.test(navigator.language || ''); } catch (e) {}

      function setSplash(message, withReload, isError) {
        var sub = document.getElementById('onyx-splash-subtitle');
        if (!sub) return;
        sub.textContent = '';
        var span = document.createElement('span');
        span.textContent = message;
        if (isError) { span.style.color = '#ef4444'; errorShown = true; }
        sub.appendChild(span);
        if (withReload) {
          var btn = document.createElement('button');
          btn.id = 'onyx-splash-reload';
          btn.textContent = t('Reload Onyx', 'Recargar Onyx');
          btn.style.cssText = 'display:block;margin:14px auto 0;padding:8px 20px;border-radius:999px;border:none;background:#fdfcf0;color:#0d0b0a;font-weight:700;font-size:13px;cursor:pointer;';
          btn.onclick = function () { location.reload(); };
          sub.appendChild(btn);
        }
      }

      function selfHeal(reason) {
        if (recovered) return;
        if (!document.getElementById('onyx-initial-splash')) return; // React already mounted; do not force reload

        if (navigator.onLine === false) {
          // Offline with a failed chunk: the cache is all we have. Keep it.
          console.warn('[Onyx] Load failure while offline, cache kept:', reason);
          setSplash(t('You are offline and part of Onyx could not load. Reconnect, then reload.', 'Estás sin conexión y una parte de Onyx no cargó. Reconéctate y recarga.'), true, true);
          return;
        }
        if (alreadyHealed()) {
          console.warn('[Onyx] Self-heal already ran for this build. Showing manual retry.', reason);
          setSplash(t('Connection interrupted.', 'Conexión interrumpida.'), true, true);
          return;
        }

        recovered = true;
        markHealed();
        console.warn('[Onyx] Self-healing reload triggered:', reason);

        var jobs = [];
        try {
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {

            }));

          if ('caches' in window) {
            jobs.push(caches.keys().then(function (names) {
              return Promise.all(names.map(function (n) { return caches.delete(n); }));
            }));
          }
        } catch (e) {}

        var reloaded = false;
        function reload() {
          if (reloaded) return;
          reloaded = true;
          var u = new URL(window.location.href);
          u.searchParams.set('v', Date.now().toString());
          window.location.replace(u.toString());
        }
        // Reload once the wipe has finished, but never wait more than 3 s for it.
        Promise.all(jobs.map(function (j) { return j.catch(function () {}); })).then(reload, reload);
        setTimeout(reload, 3000);
      }

      function sameOrigin(url) {
        return !!url && url.indexOf(location.origin) === 0;
      }

      // ONLY our own SCRIPT or stylesheet LINK failing counts (never IMG/MEDIA,
      // never Google Fonts or other third parties, which fail on any weak link).
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && (el.tagName === 'SCRIPT' || (el.tagName === 'LINK' && el.rel === 'stylesheet'))) {
          var src = el.src || el.href || '';
          if (!sameOrigin(src)) return;
          console.error('[Onyx] Critical asset load error:', src);
          selfHeal('Critical asset failed: ' + src);
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        var msg = e && e.reason ? (e.reason.message || String(e.reason)) : '';

      });

      // Slow start: say so, change nothing. After 8 s a hint, after 30 s a plain
      // reload button (no unregister, no cache wipe). React removes the splash on mount.
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (document.getElementById('onyx-initial-splash') && !recovered && !errorShown) {
            setSplash(t('Still loading. The connection looks slow.', 'Sigue cargando. La conexión parece lenta.'), false, false);
          }
        }, 8000);
        setTimeout(function () {
          if (document.getElementById('onyx-initial-splash') && !recovered && !errorShown) {
            setSplash(t('Still loading. You can wait or reload.', 'Sigue cargando. Puedes esperar o recargar.'), true, false);
          }
        }, 30000);
      });
    })();
