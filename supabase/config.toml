# Supabase project configuration for Onyx.mx
# See: https://supabase.com/docs/guides/functions/config

[project]
id = "yircifkayqpuydfdqzlm"

# ── Edge Function Configuration ────────────────────────────────────────────────
# Each function's verify_jwt setting is explicit so a new function added
# without one here is denied by default (Supabase's default is verify_jwt=true).

[functions.artifact]
# Public QR-tag lookup endpoint. Runs on service_role internally but the
# endpoint itself is unauthenticated (anyone can scan a tag).
verify_jwt = false

[functions.onyxchan-mcp]
# Accepts both staff JWTs AND hardware device tokens (ocd_ prefix).
# Device tokens are NOT JWTs, so Supabase's JWT verification must be off.
# The function enforces its own auth at the application layer (index.ts:41-64).
verify_jwt = false

[functions.onyx-mcp]
# Data MCP server for agents and the web app.
# verify_jwt is false because the function accepts two kinds of bearer token and checks them itself:
# a Supabase JWT (verified with auth.getUser) or a personal MCP token (mcp_..., verified against siri_tokens).
# Anything else gets 401. The function then checks the caller's role in app_users before granting access to tools.
verify_jwt = false

[functions.siri-inventory]
# Read-only Siri and Apple Shortcut voice adapter for warehouse inventory queries.
# Verifies a Supabase JWT or a siri token itself and answers 401 otherwise.
# A siri token is not a JWT, so the gateway check must be off.
verify_jwt = false

[functions.siri-token]
# API to create, list, and revoke siri tokens.
# Requires a valid Supabase JWT.
verify_jwt = true

