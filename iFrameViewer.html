<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Onyx | Artifact Viewer</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  
  <link rel="icon" href="/favicon.svg?v=1.75.1" />
  <link rel="icon" type="image/png" href="/favicon.png?v=1.75.1" />
  <meta name="theme-color" content="#0d0b0a" />
  
  <link rel="stylesheet" href="/index.css">

  <style>
    body, html { margin: 0; padding: 0; background: #060505; color: white; overflow: hidden; width: 100vw; height: 100vh; }
    #root { height: 100%; width: 100%; }
    #root > div { height: 100% !important; overflow-y: auto !important; }
  </style>

  <script type="text/javascript">
    // STANDALONE VIEWER ENFORCEMENT & SANDBOX ADAPTATION
    (function() {
      const params = new URLSearchParams(window.location.search);
      if (!params.has('viewer') && !window.location.hash.includes('viewer')) {
        params.set('viewer', 'true');
        const newUrl = window.location.pathname + '?' + params.toString() + window.location.hash;
        window.history.replaceState(null, '', newUrl);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <!-- SVG Filters (Synced with index.html) -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;">
    <filter id="liquid-glass">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.04" numOctaves="3" seed="0" />
      <feDisplacementMap in="SourceGraphic" scale="20" />
    </filter>
  </svg>

  <!-- Vite Entry Point (Vite will transform this to an absolute URL during build) -->
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
