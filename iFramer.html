    .liquid-blob {
      filter: blur(160px);
      opacity: .45;
      mix-blend-mode: screen;
      pointer-events: none;
      border-radius: 50%;
      width: 90%;
      height: 90%;
      position: absolute
    }

    html:not([class*=theme-talan]):not([class*=theme-fluorite]):not([class*=theme-earth]):not([class*=theme-stitch]) .liquid-blob {
      mix-blend-mode: multiply;
      opacity: .25
    }

    html.theme-talan .liquid-blob {
      opacity: .22;
      filter: blur(280px)
    }

    .blob-1 {
      background: radial-gradient(circle, var(--c1, #00bcd4), transparent 70%);
      animation: 25s ease-in-out infinite alternate move-blob-1;
      top: -20%;
      left: -20%
    }

    .blob-2 {
      background: radial-gradient(circle, var(--c2, #b8860b), transparent 70%);
      animation: 35s ease-in-out infinite alternate-reverse move-blob-2;
      bottom: -20%;
      right: -20%
    }

    .blob-3 {
      background: radial-gradient(circle, var(--c3, #221a16), transparent 70%);
      animation: 45s ease-in-out infinite alternate move-blob-3;
      top: 40%;
      left: 30%
    }

    .blob-4 {
      background: radial-gradient(circle, var(--main-color, #8da388), transparent 75%);
      animation: 30s ease-in-out infinite alternate-reverse move-blob-4;
      bottom: 20%;
      left: 40%
    }

    .blob-5 {
      background: radial-gradient(circle, var(--secondary-color, #b8860b), transparent 60%);
      animation: 40s ease-in-out infinite alternate-reverse move-blob-5;
      top: 15%;
      right: 25%
    }

    .static-bg {
      background-color: var(--app-bg-solid, #0a0a0f)
    }

    @keyframes move-blob-1 {
      0% {
        transform: translate(0)scale(1)rotate(0)

      to {
        transform: translate(30%, 20%)scale(1.3)rotate(15deg)
      }
    }

    @keyframes move-blob-2 {

      }

        transform: translate(-25%, -35%)scale(.9)rotate(-20deg)

      gap: 1rem;

      justify-content: space-between;

    :root {
      --ease-spring: cubic-bezier(.175, .885, .32, 1.275);
      --ease-smooth: cubic-bezier(.4, 0, .2, 1);
      --ease-out-quart: cubic-bezier(.25, 1, .5, 1);
      --transition-base: .25s var(--ease-smooth);
      --transition-spring: .4s var(--ease-spring)
    }

    body {
      font-feature-settings: "ss01", "cv01", "kern";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-family: DM Sans, system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6

    .font-display {

    .sidebar {
      transition: all .35s var(--ease-smooth)

    .sidebar-list-item {
      transition: all .2s var(--ease-smooth);
      letter-spacing: .01em;
      font-size: .875rem

    .sidebar-list-item:hover {
      transform: translate(2px)
    }

    .sidebar-list-item.active {
      transform: translate(0)

    @keyframes logoSlideIn {
      0% {
        opacity: 0;
        filter: blur(4px);
        transform: scaleX(.8)translate(-8px)

      to {
        opacity: 1;
        filter: blur();
        transform: scaleX(1)translate(0)
      }
    }

    @keyframes logoSlideOut {
      0% {
        opacity: 1;
        transform: scaleX(1)
      }

      to {
        opacity: 0;
        transform: scaleX(.8)
      }
    }

    .sidebar-logo-text {
      animation: logoSlideIn .4s var(--ease-spring) forwards;
      transform-origin: 0;
      white-space: nowrap;
      overflow: hidden

        color: color-mix(in srgb, var(--text-color) 72%, transparent)
      }
    }

    .glass-value-secondary {
      margin-top: 2px;
      font-family: ui-monospace, SF Mono, monospace
    }

    @keyframes skeleton-shimmer {
      0% {
        background-position: -200% 0
      }

      to {
        background-position: 200% 0
      }
    }

    .skeleton {
      background: linear-gradient(90deg, var(--text-color) 25%, var(--text-color) 50%, var(--text-color) 75%)
    }

    @supports (color:color-mix(in lab, red, red)) {
      .skeleton {
        background: linear-gradient(90deg, color-mix(in srgb, var(--text-color) 5%, transparent) 25%, color-mix(in srgb, var(--text-color) 11%, transparent), color-mix(in srgb, var(--text-color) 5%, transparent) 75%)
      }
    }

    .skeleton {
      background-size: 200% 100%;
      border-radius: .5rem;
      animation: 1.8s ease-in-out infinite skeleton-shimmer
    }

    @keyframes optimistic-revert {

      0%,
      to {
        opacity: 1
      }

      40% {
        opacity: .35;
        background-color: #ef44441a
      }
    }

    .optimistic-revert {
      animation: .45s optimistic-revert
    }

    @media(prefers-reduced-motion:reduce) {
      .skeleton {
        opacity: .45;
        animation: none
      }

      .optimistic-revert {
        animation: none
      }
    }
