  geom.computeBoundingBox();

  if (!bb) return;
  const pos = geom.attributes.position;
  const norm = geom.attributes.normal;
  const spanX = Math.max(0.001, bb.max.x - bb.min.x);
  const spanY = Math.max(0.001, bb.max.y - bb.min.y);
  const spanZ = Math.max(0.001, bb.max.z - bb.min.z);

  const u0 = bboxUv[0] ?? 0;
  const v0Top = bboxUv[1] ?? 0;
  const u1 = bboxUv[2] ?? 1;
  const v1Top = bboxUv[3] ?? 1;
  const vMinGL = 1.0 - v1Top;
  const vMaxGL = 1.0 - v0Top;

  const uvs = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const nx = norm ? Math.abs(norm.getX(i)) : 0;
    const ny = norm ? Math.abs(norm.getY(i)) : 0;
    const nz = norm ? Math.abs(norm.getZ(i)) : 1;

    let lu = 0, lv = 0;
    if (ny > nx && ny > nz) {
      lu = (x - bb.min.x) / spanX;
      lv = 1.0 - (z - bb.min.z) / spanZ;
    } else if (nx > nz) {
      lu = (z - bb.min.z) / spanZ;
      lv = (y - bb.min.y) / spanY;
    } else {
      lu = (x - bb.min.x) / spanX;
      lv = (y - bb.min.y) / spanY;
    }
    uvs[i * 2] = u0 + lu * (u1 - u0);
    uvs[i * 2 + 1] = vMinGL + lv * (vMaxGL - vMinGL);
  }
  geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
}

/**
 * Unwraps a 4-sided Tower/Floor Lamp column shot from a side corner:
 * - Left-Front face (+Z, x in [-hw, +hw]) maps u in [uMin, uCorner]
 * - Right-Front face (+X, z in [+hd, -hd]) maps u in [uCorner, uMax]
 * - Rear faces (-Z and -X) mirror-wrap continuously so all 4 vertical corners have seamless stone veins.
 */
function applyCornerLampUVs(geom, cornerSpec) {
  geom.computeBoundingBox();
  const bb = geom.boundingBox;
  if (!bb) return;
  const pos = geom.attributes.position;
  const norm = geom.attributes.normal;
  const spanX = Math.max(0.001, bb.max.x - bb.min.x);
  const spanY = Math.max(0.001, bb.max.y - bb.min.y);
  const spanZ = Math.max(0.001, bb.max.z - bb.min.z);

  const bbox = [0.02, 0.02, 0.98, 0.98];
  const uMin = bbox[0], vMinTop = bbox[1], uMax = bbox[2], vMaxTop = bbox[3];
  const uCornerFrac = (cornerSpec && cornerSpec.u_corner_frac) || 0.5;
  const uCorner = uMin + uCornerFrac * (uMax - uMin);
  const vMinGL = 1.0 - vMaxTop;
  const vMaxGL = 1.0 - vMinTop;

  const uvs = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const nx = norm ? norm.getX(i) : 0;
    const ny = norm ? norm.getY(i) : 0;
    const nz = norm ? norm.getZ(i) : 1;

    const tx = (x - bb.min.x) / spanX; // 0 at -hw, 1 at +hw (corner)
    const ty = (y - bb.min.y) / spanY; // 0 at bottom, 1 at top
    const tz = (z - bb.min.z) / spanZ; // 0 at -hd, 1 at +hd (corner)

    let u = uCorner;
    const v = vMinGL + ty * (vMaxGL - vMinGL);

    if (Math.abs(ny) > 0.75) {
      u = uMin + tx * (uMax - uMin);
    } else if (Math.abs(nz) >= Math.abs(nx)) {
      if (nz >= 0) {
        // Left-Front face (+Z): x goes from -hw (tx=0 -> uMin) to +hw corner (tx=1 -> uCorner)
        u = uMin + tx * (uCorner - uMin);
      } else {
        // Back-Right face (-Z): x goes from +hw (tx=1 -> uMax) to -hw (tx=0 -> uCorner)
        u = uCorner + tx * (uMax - uCorner);
      }
    } else {
      if (nx >= 0) {
        // Right-Front face (+X): z goes from +hd corner (tz=1 -> uCorner) to -hd (tz=0 -> uMax)
        u = uCorner + (1.0 - tz) * (uMax - uCorner);
      } else {
        // Back-Left face (-X): z goes from -hd (tz=0 -> uCorner) to +hd (tz=1 -> uMin)
        u = uCorner - tz * (uCorner - uMin);
      }
    }
    uvs[i * 2] = u;
    uvs[i * 2 + 1] = v;
  }
  geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
}

function addShadowMesh(geo, mat, x = 0, y = 0, z = 0) {

const arch = ITEM.archetype;
const shapeLower = (ITEM.shape || '').toLowerCase();

if (arch === 'bowl') {
  // Task C: Multi-view Bowl lofted directly from exact 2D SVG rim contour (`rim_contour_xz` / `rim_radii`)
  // and monotonic side-profile wall flare (`wall_profile_r`), guaranteeing an open concave vessel with
  // exact W x H x L dimensions and zero mirror-flipped UVs or self-intersecting top lids.
  const vc = MASK_ATTR.vessel_contours || {};
  const rimContour = (Array.isArray(vc.rim_contour_xz) && vc.rim_contour_xz.length >= 16) ? vc.rim_contour_xz : null;
  const rimRadii = (Array.isArray(vc.rim_radii) && vc.rim_radii.length >= 8) ? vc.rim_radii : null;
  const rawWallProf = (Array.isArray(vc.wall_profile_r) && vc.wall_profile_r.length >= 4) ? vc.wall_profile_r : null;

  // Enforce monotonic non-decreasing outer wall flare from foot (t=0) to open rim (t=1)
  let wallProf = null;
  if (rawWallProf) {
    wallProf = rawWallProf.slice();
    wallProf[0] = Math.max(0.36, Math.min(0.56, wallProf[0]));
    for (let wi = 1; wi < wallProf.length; wi++) {
      wallProf[wi] = Math.max(wallProf[wi], wallProf[wi - 1]);
    }
    const wMax = Math.max(0.1, wallProf[wallProf.length - 1]);
    for (let wi = 0; wi < wallProf.length; wi++) {
      wallProf[wi] = Math.max(0.36, Math.min(1.0, wallProf[wi] / wMax));
    }
    wallProf[wallProf.length - 1] = 1.0;
  }

  const rFootFrac = wallProf ? wallProf[0] : 0.44;
  const wallRatio = 0.095;
  const floorY = Math.max(H * 0.08, Math.min(W, L) * 0.5 * wallRatio * 1.15);
  const uSteps = 96;
  const vSteps = 40;
  const positions = [];
  const uvs = [];
  const indices = [];

  function sampleFlare(t01) {
    if (!wallProf) return rFootFrac + (1.0 - rFootFrac) * Math.pow(t01, 0.62);
    const f = Math.max(0, Math.min(1, t01)) * (wallProf.length - 1);
    const i0 = Math.floor(f);
    const i1 = Math.min(wallProf.length - 1, i0 + 1);
    return wallProf[i0] * (1 - (f - i0)) + wallProf[i1] * (f - i0);
  }

  for (let iu = 0; iu <= uSteps; iu++) {
    const uFrac = (iu % uSteps) / uSteps;
    const theta = uFrac * Math.PI * 2 - Math.PI;
    let uxRim = 0.5 * Math.cos(theta);
    let uyRim = 0.5 * Math.sin(theta);

    if (rimContour) {
      const f = uFrac * rimContour.length;
      const i0 = Math.floor(f) % rimContour.length;
      const i1 = (i0 + 1) % rimContour.length;
      const frac = f - Math.floor(f);
      uxRim = rimContour[i0][0] * (1 - frac) + rimContour[i1][0] * frac;
      uyRim = rimContour[i0][1] * (1 - frac) + rimContour[i1][1] * frac;
    } else if (rimRadii) {
      const f = uFrac * rimRadii.length;
      const i0 = Math.floor(f) % rimRadii.length;
      const i1 = (i0 + 1) % rimRadii.length;
      const frac = f - Math.floor(f);
      const rMod = rimRadii[i0] * (1 - frac) + rimRadii[i1] * frac;
      uxRim = 0.5 * Math.cos(theta) * rMod;
      uyRim = 0.5 * Math.sin(theta) * rMod;
    }

    // Natural hand-carved rim height undulation where wider organic lobes rise gently to H
    const rLobe = Math.min(1.25, Math.hypot(uxRim, uyRim) / 0.5);
    const yRim = H * (0.93 + 0.07 * rLobe);

    for (let iv = 0; iv <= vSteps; iv++) {
      const v = iv / vSteps;
      let rFrac = 0;
      let py = 0;
      let rUv = 0;

      if (v <= 0.08) {
        // Flat bottom pedestal base from center (0) to foot ring (rFootFrac)
        const t = v / 0.08;
        rFrac = rFootFrac * t;
        py = 0;
        rUv = 0.84 * t;
      } else if (v <= 0.46) {
        // Monotonically flaring exterior stone wall from foot (t=0) to outer rim (t=1)
        const t = (v - 0.08) / 0.38;
        rFrac = sampleFlare(t);
        py = yRim * Math.pow(t, 0.90);
        // Sample outer stone band (0.84..1.0) on exterior wall so interior labels/tape never project outside
        rUv = 0.84 + 0.16 * t;
      } else if (v <= 0.54) {
        // Thick rounded hand-carved stone rim lip
        const t = (v - 0.46) / 0.08;
        rFrac = 1.0 - wallRatio * (0.5 - 0.5 * Math.cos(t * Math.PI));
        py = yRim + Math.sin(t * Math.PI) * (H * 0.024);
        rUv = rFrac;
      } else {
        // Smooth concave hollowed interior basin descending to floorY
        const t = 1.0 - (v - 0.54) / 0.46;
        const innerRimR = 1.0 - wallRatio;
        rFrac = innerRimR * Math.sin(t * Math.PI * 0.5);
        py = floorY + (yRim - floorY) * Math.pow(t, 1.32);
        rUv = rFrac;
      }

      // Map image (uxRim, uyRim) to 3D (px, pz) with +uy (top of image) at -Z (back/top of 3D view)
      const px = uxRim * W * rFrac;
      const pz = -uyRim * L * rFrac;
      positions.push(px, py, pz);

      const uCoord = Math.max(0.01, Math.min(0.99, uxRim * rUv + 0.5));
      const vCoord = Math.max(0.01, Math.min(0.99, uyRim * rUv + 0.5));
      uvs.push(uCoord, vCoord);
    }
  }

  const bowlStride = vSteps + 1;
  for (let iu = 0; iu < uSteps; iu++) {
    for (let iv = 0; iv < vSteps; iv++) {
      const a = iu * bowlStride + iv;
      const b = (iu + 1) * bowlStride + iv;
      const c = (iu + 1) * bowlStride + (iv + 1);
      const d = iu * bowlStride + (iv + 1);
      indices.push(a, b, d);
      indices.push(b, c, d);
    }
  }

  const bowlGeo = new THREE.BufferGeometry();
  bowlGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  bowlGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  bowlGeo.setIndex(indices);
  bowlGeo.computeVertexNormals();
  addShadowMesh(bowlGeo, stoneMat, 0, 0, 0);
  internalLight.color.setHex(0xfff8ed);
  internalLight.intensity = 1.85;
  internalLight.position.set(0, H * 0.38, 0);

} else if (arch === 'canoe') {
  // Task B: Multi-view Canoe lofted from top_down rim contour (plan_half_widths) + side_profile prow/rocker (profile_top_y, profile_bot_y)
  const vc = MASK_ATTR.vessel_contours || {};
  const halfWidths = vc.plan_half_widths || null;
  const topYCurve = vc.profile_top_y || null;
  const botYCurve = vc.profile_bot_y || null;

  const len = Math.max(W, L);
  const wid = Math.min(W, L);
  const uSteps = 72;
  const vSteps = 32;
  const wallThick = Math.max(0.045, wid * 0.11);

  const positions = [];
  const uvs = [];
  const indices = [];

  function sampleArray(arr, t01, fallback) {
    if (!arr || !arr.length) return fallback;
    const f = Math.max(0, Math.min(1, t01)) * (arr.length - 1);
    const i0 = Math.floor(f);
    const i1 = Math.min(arr.length - 1, i0 + 1);
    return arr[i0] * (1 - (f - i0)) + arr[i1] * (f - i0);
  }

  for (let iu = 0; iu <= uSteps; iu++) {
    const u = iu / uSteps;
    const theta = u * Math.PI * 2;
    const cosT = Math.cos(theta);
    const sinT = Math.sin(theta);
    const xNorm = cosT * 0.5 + 0.5; // 0..1 from stern to bow
    const longAbs = Math.abs(cosT);

    // Mask-driven plan half-width envelope + side-profile prow lift and keel rocker
    const planFactor = sampleArray(halfWidths, xNorm, Math.pow(1 - Math.pow(longAbs, 2.1) * 0.35, 0.7));
    const profTop = sampleArray(topYCurve, xNorm, 0.78 + Math.pow(longAbs, 2.5) * 0.22);
    const profBot = sampleArray(botYCurve, xNorm, Math.pow(longAbs, 2.2) * 0.16);

    const localTopY = H * profTop;
    const localBotY = H * profBot * 0.45;
    const localSpanY = Math.max(H * 0.25, localTopY - localBotY);

    for (let iv = 0; iv <= vSteps; iv++) {
      const v = iv / vSteps;
      let rFrac = 0;
      let yVal = 0;

      if (v <= 0.48) {
        const t = v / 0.48;
        rFrac = 0.24 + 0.76 * Math.sin(t * Math.PI * 0.5);
        yVal = localBotY + localSpanY * Math.pow(t, 0.88);
      } else if (v <= 0.54) {
        const t = (v - 0.48) / 0.06;
        const innerR = Math.max(0.2, 1.0 - wallThick / Math.max(0.08, wid * 0.5));
        rFrac = 1.0 - (1.0 - innerR) * t;
        yVal = localTopY + Math.sin(t * Math.PI) * wallThick * 0.25;
      } else {
        const t = 1.0 - (v - 0.54) / 0.46;
        const innerR = Math.max(0.2, 1.0 - wallThick / Math.max(0.08, wid * 0.5));
        rFrac = Math.max(0.02, innerR * Math.sin(t * Math.PI * 0.5));
        const floorY = localBotY + wallThick * 1.15;
        yVal = floorY + (localTopY - floorY) * Math.pow(t, 1.25);
      }

      const px = cosT * (len * 0.5) * rFrac;
      const pz = sinT * (wid * 0.5) * rFrac * planFactor;
      const py = yVal;

      positions.push(px, py, pz);
      const uRaw = Math.max(0.01, Math.min(0.99, (px / Math.max(0.001, len)) + 0.5));
      const vRaw = Math.max(0.01, Math.min(0.99, 0.5 - (pz / Math.max(0.001, wid))));
      uvs.push(uRaw, vRaw);
    }
  }

  const stride = vSteps + 1;
  for (let iu = 0; iu < uSteps; iu++) {
    for (let iv = 0; iv < vSteps; iv++) {
      const a = iu * stride + iv;
      const b = (iu + 1) * stride + iv;
      const c = (iu + 1) * stride + (iv + 1);
      const d = iu * stride + (iv + 1);
      indices.push(a, b, d);
      indices.push(b, c, d);
    }
  }

  const canoeGeo = new THREE.BufferGeometry();
  canoeGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  canoeGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  canoeGeo.setIndex(indices);
  canoeGeo.computeVertexNormals();
  addShadowMesh(canoeGeo, stoneMat, 0, 0.04, 0);
  internalLight.position.set(0, H * 0.48, 0);

} else if (arch === 'mirror') {
  // Task A: SVG-cut Mirror using exact outer stone contour + inner hand-carved mirror opening
  const depth = Math.max(0.09, Math.min(L, 0.22));
  const mc = MASK_ATTR.mirror_contours || null;
  const frameSh = new THREE.Shape();
  const glassSh = new THREE.Shape();
  const rw = W * 0.5, rh = H * 0.5;

  if (mc && Array.isArray(mc.outer_points) && mc.outer_points.length >= 6) {
    mc.outer_points.forEach((pt, idx) => {
      const px = pt[0] * W;
      const py = pt[1] * H;
      if (idx === 0) frameSh.moveTo(px, py);
      else frameSh.lineTo(px, py);
    });
    frameSh.closePath();

    const holePts = (Array.isArray(mc.inner_hole_points) && mc.inner_hole_points.length >= 6)
      ? mc.inner_hole_points
      : mc.outer_points.map(p => [p[0] * 0.55, p[1] * 0.55]);
    const hole = new THREE.Path();
    holePts.forEach((pt, idx) => {
      const hx = pt[0] * W;
      const hy = pt[1] * H;
      const gx = hx * 1.02;
      const gy = hy * 1.02;
      if (idx === 0) { hole.moveTo(hx, hy); glassSh.moveTo(gx, gy); }
      else { hole.lineTo(hx, hy); glassSh.lineTo(gx, gy); }
    });
    hole.closePath();
    glassSh.closePath();
    frameSh.holes.push(hole);
  } else {
    const isRound = shapeLower.includes('round') || shapeLower.includes('circle') || shapeLower.includes('oval') || Math.abs(W - H) < 0.15;
    const rim = Math.min(rw, rh) * 0.26;
    if (isRound) {
      frameSh.absellipse(0, 0, rw, rh, 0, Math.PI * 2, false, 0);
      const hole = new THREE.Path();
      hole.absellipse(0, 0, rw - rim, rh - rim, 0, Math.PI * 2, true, 0);
      frameSh.holes.push(hole);
      glassSh.absellipse(0, 0, rw - rim * 0.9, rh - rim * 0.9, 0, Math.PI * 2, false, 0);
    } else {
      frameSh.moveTo(-rw, -rh); frameSh.lineTo(rw, -rh); frameSh.lineTo(rw, rh); frameSh.lineTo(-rw, rh); frameSh.closePath();
      const hole = new THREE.Path();
      hole.moveTo(-(rw - rim), -(rh - rim)); hole.lineTo(-(rw - rim), rh - rim); hole.lineTo(rw - rim, rh - rim); hole.lineTo(rw - rim, -(rh - rim)); hole.closePath();
      frameSh.holes.push(hole);
      glassSh.moveTo(-(rw - rim * 0.9), -(rh - rim * 0.9)); glassSh.lineTo(rw - rim * 0.9, -(rh - rim * 0.9)); glassSh.lineTo(rw - rim * 0.9, rh - rim * 0.9); glassSh.lineTo(-(rw - rim * 0.9), rh - rim * 0.9); glassSh.closePath();
    }
  }

  const frameGeo = new THREE.ExtrudeGeometry(frameSh, { depth, bevelEnabled: true, bevelThickness: 0.018, bevelSize: 0.015, bevelSegments: 4 });
  applyBoxUVsInSubregion(frameGeo, [0, 0, 1, 1]);
  addShadowMesh(frameGeo, stoneMat, 0, rh + 0.1, -depth * 0.5);

  const mirrorMat = new THREE.MeshPhysicalMaterial({ color: 0xdbeafe, metalness: 0.98, roughness: 0.02, clearcoat: 1.0, reflectivity: 1.0 });
  const glassGeo = new THREE.ExtrudeGeometry(glassSh, { depth: 0.018, bevelEnabled: false });
  addShadowMesh(glassGeo, mirrorMat, 0, rh + 0.1, -depth * 0.15);
  internalLight.position.set(0, rh + 0.1, -depth * 1.4);

} else if (arch === 'yin_yang_fountain') {
  const plinthH = H * 0.16;
  const bodyH = H * 0.84;
  const plinthGeo = new THREE.BoxGeometry(W * 1.08, plinthH, Math.max(L, W * 0.38));
  addShadowMesh(plinthGeo, stoneMat, 0, plinthH * 0.5, 0);

  const gap = W * 0.025;
  const halfW = (W - gap) * 0.5;
  const rHole = Math.min(W, bodyH) * 0.19;
  const slabDepth = Math.max(0.14, L * 0.65);

  const leftSh = new THREE.Shape();
  leftSh.moveTo(-halfW, -bodyH * 0.5);
  leftSh.lineTo(0, -bodyH * 0.5);
  leftSh.lineTo(0, -rHole);
  leftSh.absarc(0, 0, rHole, -Math.PI / 2, Math.PI / 2, true);
  leftSh.lineTo(0, bodyH * 0.5);
  leftSh.lineTo(-halfW, bodyH * 0.5);
  leftSh.closePath();

  const rightSh = new THREE.Shape();
  rightSh.moveTo(0, -bodyH * 0.5);
  rightSh.lineTo(halfW, -bodyH * 0.5);
  rightSh.lineTo(halfW, bodyH * 0.5);
  rightSh.lineTo(0, bodyH * 0.5);
  rightSh.lineTo(0, rHole);
  rightSh.absarc(0, 0, rHole, Math.PI / 2, -Math.PI / 2, true);
  rightSh.closePath();

  const extOpts = { depth: slabDepth, bevelEnabled: true, bevelThickness: 0.018, bevelSize: 0.015, bevelSegments: 3 };
  addShadowMesh(new THREE.ExtrudeGeometry(leftSh, extOpts), stoneMat, -gap * 0.5, plinthH + bodyH * 0.5, -slabDepth * 0.5);
  addShadowMesh(new THREE.ExtrudeGeometry(rightSh, extOpts), stoneMat, gap * 0.5, plinthH + bodyH * 0.5, -slabDepth * 0.5);
  internalLight.position.set(0, plinthH + bodyH * 0.5, 0);

} else if (arch === 'wall_panel_pair') {
  // Task D: Wall Panel Pair — single photo contains both panels side-by-side!
  // Extract left & right contours and map Left Panel UVs to left_bbox_uv and Right Panel UVs to right_bbox_uv.
  const thick = Math.max(0.06, Math.min(L, 0.14));
  const panelW = W * 0.47;
  const gap = W * 0.04;
  const ppc = MASK_ATTR.panel_pair_contours || {};
  const leftBbox = [0.0, 0.0, 0.492, 1.0];
  const rightBbox = [0.508, 0.0, 1.0, 1.0];

  function buildPairSlabGeo(ptsArray, bboxUv) {
    let geo;
    if (Array.isArray(ptsArray) && ptsArray.length >= 6) {
      const sh = new THREE.Shape();
      ptsArray.forEach((pt, idx) => {
        const px = pt[0] * panelW;
        const py = pt[1] * H;
        if (idx === 0) sh.moveTo(px, py);
        else sh.lineTo(px, py);
      });
      sh.closePath();
      geo = new THREE.ExtrudeGeometry(sh, { depth: thick, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 3 });
      geo.center();
    } else {
      geo = new THREE.BoxGeometry(panelW, H, thick, 4, 4, 2);
    }
    applyBoxUVsInSubregion(geo, bboxUv);
    return geo;
  }

  const leftGeo = buildPairSlabGeo(ppc.left_points, leftBbox);
  const rightGeo = buildPairSlabGeo(ppc.right_points, rightBbox);
  addShadowMesh(leftGeo, stoneMat, -(panelW * 0.5 + gap * 0.5), H * 0.5 + 0.08, 0);
  addShadowMesh(rightGeo, stoneMat, (panelW * 0.5 + gap * 0.5), H * 0.5 + 0.08, 0);
  internalLight.position.set(0, H * 0.5 + 0.08, -thick * 2.2);

} else if (arch === 'wall_panel') {
  const thick = Math.max(0.07, Math.min(L, 0.16));
  const wpc = MASK_ATTR.wall_panel_contours || {};
  const isFree = shapeLower.includes('free') || shapeLower.includes('organic');
  let geo;
  if (isFree && Array.isArray(wpc.outer_points) && wpc.outer_points.length >= 6) {
    const sh = new THREE.Shape();
    wpc.outer_points.forEach((pt, idx) => {
      if (idx === 0) sh.moveTo(pt[0] * W, pt[1] * H);
      else sh.lineTo(pt[0] * W, pt[1] * H);
    });
    sh.closePath();
    geo = new THREE.ExtrudeGeometry(sh, { depth: thick, bevelEnabled: true, bevelThickness: 0.014, bevelSize: 0.012, bevelSegments: 3 });
    geo.center();
  } else {
    geo = new THREE.BoxGeometry(W, H, thick);
  }
  applyBoxUVsInSubregion(geo, [0, 0, 1, 1]);
  addShadowMesh(geo, stoneMat, 0, H * 0.5 + 0.08, 0);
  internalLight.position.set(0, H * 0.5 + 0.08, -thick * 2.2);

} else if (arch === 'tower_lamp' || arch === 'floor_lamp') {
  // Task E: Tower Lamp photos are taken at a side corner showing two adjacent faces meeting at the central vertical corner edge!
  const isCyl = shapeLower.includes('cylin') || shapeLower.includes('round') || shapeLower.includes('oval');
  const isSphere = shapeLower.includes('sphere') || shapeLower.includes('ball') || shapeLower.includes('globe');
  const isPyr = shapeLower.includes('pyram') || shapeLower.includes('trian');
  const cornerSpec = MASK_ATTR.tower_lamp_corner_uv || null;

  const baseH = Math.min(0.12, H * 0.08);
  const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e2028, roughness: 0.4, metalness: 0.6 });
  addShadowMesh(new THREE.BoxGeometry(W * 0.92, baseH, L * 0.92), baseMat, 0, baseH * 0.5, 0);

  const bodyH = H - baseH;
  if (isSphere) {
    const r = Math.max(W, H, L) * 0.48;
    const g = new THREE.SphereGeometry(r, 64, 48);
    applyBoxUVsInSubregion(g, MASK_ATTR.bbox_uv || [0, 0, 1, 1]);
    addShadowMesh(g, stoneMat, 0, baseH + r * 0.95, 0);
  } else if (isCyl) {
    const r = Math.max(W, L) * 0.46;
    const g = new THREE.CylinderGeometry(r * 0.88, r, bodyH, 64, 1, false);
    const cyl = addShadowMesh(g, stoneMat, 0, baseH + bodyH * 0.5, 0);
    if (Math.abs(W - L) > 0.08) cyl.scale.set(1, 1, L / W);
  } else {
    // Hollowed 4-sided stone column with side-corner UV unwrapping across the front corner ridge (+hw, +hd)
    const colW = W * 0.88;
    const colL = L * 0.88;
    const wallT = Math.max(0.035, Math.min(colW, colL) * 0.12);
    const outerSh = new THREE.Shape();
    const hw = colW * 0.5, hd = colL * 0.5;
    outerSh.moveTo(-hw, -hd); outerSh.lineTo(hw, -hd); outerSh.lineTo(hw, hd); outerSh.lineTo(-hw, hd); outerSh.closePath();

    const innerHole = new THREE.Path();
    const ihw = Math.max(0.04, hw - wallT), ihd = Math.max(0.04, hd - wallT);
    innerHole.moveTo(-ihw, -ihd); innerHole.lineTo(ihw, -ihd); innerHole.lineTo(ihw, ihd); innerHole.lineTo(-ihw, ihd); innerHole.closePath();
    outerSh.holes.push(innerHole);

    const colGeo = new THREE.ExtrudeGeometry(outerSh, { depth: bodyH, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 });
    colGeo.rotateX(-Math.PI / 2);
    colGeo.center();

    const taper = isPyr ? 0.42 : ((cornerSpec && cornerSpec.taper_ratio && cornerSpec.taper_ratio < 0.86) ? cornerSpec.taper_ratio : 1.0);
    if (taper < 0.96) {
      const pos = colGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const vy = pos.getY(i);
        const t = (vy + bodyH * 0.5) / Math.max(0.001, bodyH);
        const s = 1.0 - t * (1.0 - taper);
        pos.setX(i, pos.getX(i) * s);
        pos.setZ(i, pos.getZ(i) * s);
      }
      colGeo.computeVertexNormals();
    }

    // Map left half of corner-shot photo to +Z face and right half to +X face meeting at the (+hw, +hd) corner edge
    applyCornerLampUVs(colGeo, cornerSpec);
    addShadowMesh(colGeo, stoneMat, 0, baseH + bodyH * 0.5, 0);
  }
  internalLight.position.set(0, baseH + bodyH * 0.48, 0);
  internalLight.intensity = 6.2;

} else if (arch === 'table') {
  const topH = Math.max(0.08, H * 0.14);
  const pedH = H - topH;
  addShadowMesh(new THREE.BoxGeometry(W, topH, L), stoneMat, 0, pedH + topH * 0.5, 0);
  addShadowMesh(new THREE.BoxGeometry(W * 0.52, pedH, L * 0.52), stoneMat, 0, pedH * 0.5, 0);
  internalLight.position.set(0, H * 0.5, 0);
} else {
  const g = new THREE.BoxGeometry(W, H, L);
  applyBoxUVsInSubregion(g, MASK_ATTR.bbox_uv || [0, 0, 1, 1]);
  addShadowMesh(g, stoneMat, 0, H * 0.5, 0);
  internalLight.position.set(0, H * 0.5, 0);
}

// Frame camera nicely
const centerY = H * 0.48;
controls.target.set(0, centerY, 0);
const camDist = Math.max(W, H, L) * 2.05;
const camElev = (arch === 'bowl' || arch === 'canoe') ? 0.68 : 0.35;
camera.position.set(camDist * 0.62, centerY + camDist * camElev, camDist * 0.88);
controls.update();

// Progressive enhancement: blend real clean-room cutout PNG and SVG vein mask if accessible
const statusEl = document.getElementById('ui-tex-status');
const mvSummary = ITEM.angle_views
  ? Object.entries(ITEM.angle_views).map(([k, v]) => `${k}:${v.view_class}(${v.elevation_deg}°)`).join(' • ')
  : '';
const taskBadge = MASK_ATTR.mirror_contours ? 'SVG Inner/Outer Mirror Cut'
  : MASK_ATTR.panel_pair_contours ? `Dual-Slab Pair (${MASK_ATTR.panel_pair_contours.mode})`
  : MASK_ATTR.tower_lamp_corner_uv ? `Corner-Shot UV Unwrap (u*=${MASK_ATTR.tower_lamp_corner_uv.u_corner_frac})`
  : MASK_ATTR.vessel_contours ? 'Multi-View Rim+Profile Contours'
  : 'Onyx Shader Active';

statusEl.textContent = mvSummary
  ? `${taskBadge} • ${mvSummary}`
  : `${taskBadge} • ${(ITEM.vein_colors || []).length} Vein Clusters`;

const primaryCutout = ITEM.plan_cutout_url || ITEM.cutout_url;
const secondaryCutout = (ITEM.profile_cutout_url && ITEM.profile_cutout_url !== primaryCutout) ? ITEM.profile_cutout_url : null;

if (primaryCutout) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const ctx = albedoCanvas.getContext('2d');
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      const tmp = document.createElement('canvas');
      tmp.width = iw; tmp.height = ih;
      const tCtx = tmp.getContext('2d', { willReadFrequently: true });
      let sx = 0, sy = 0, sw = iw, sh = ih;
      if (tCtx && iw > 0 && ih > 0) {
        tCtx.drawImage(img, 0, 0);
        const data = tCtx.getImageData(0, 0, iw, ih).data;
        let minX = iw, minY = ih, maxX = 0, maxY = 0, found = false;
        for (let y = 0; y < ih; y += 2) {
          for (let x = 0; x < iw; x += 2) {
            const idx = (y * iw + x) * 4;
            const a = data[idx + 3];
            const r = data[idx], g = data[idx + 1], b = data[idx + 2];
            if (a > 32 && !(r > 248 && g > 248 && b > 248)) {
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
              found = true;
            }
          }
        }
        if (found && maxX > minX + 16 && maxY > minY + 16) {
          sx = minX; sy = minY; sw = maxX - minX; sh = maxY - minY;
        }
      }
      const cw = albedoCanvas.width, ch = albedoCanvas.height;
      ctx.save();
      ctx.clearRect(0, 0, cw, ch);
      ctx.filter = 'blur(36px)';
      ctx.drawImage(img, sx, sy, sw, sh, -cw * 0.12, -ch * 0.12, cw * 1.24, ch * 1.24);
      ctx.filter = 'blur(16px)';
      ctx.drawImage(img, sx, sy, sw, sh, -cw * 0.04, -ch * 0.04, cw * 1.08, ch * 1.08);
      ctx.filter = 'none';
      ctx.globalAlpha = 1.0;
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cw, ch);
      ctx.restore();
      colorTex.needsUpdate = true;
      statusEl.textContent = mvSummary
        ? `${taskBadge} • Multi-View True-Color (${mvSummary})`
        : `${taskBadge} • True-Color Cutout PNG`;
    } catch (e) {}
  };
  img.src = primaryCutout;
}

const primaryVeinSvg = ITEM.plan_vein_svg_url || ITEM.vein_svg_url;
if (primaryVeinSvg) {
  const vimg = new Image();
  vimg.crossOrigin = 'anonymous';
  vimg.onload = () => {
    const bctx = bumpCanvas.getContext('2d');
    bctx.save();
    bctx.globalAlpha = 0.9;
    bctx.drawImage(vimg, 0, 0, bumpCanvas.width, bumpCanvas.height);
    bctx.restore();
    bumpTex.needsUpdate = true;
  };
  vimg.src = primaryVeinSvg;
}

let backlightOn = true;
document.getElementById('btn-backlight').addEventListener('click', (e) => {
  backlightOn = !backlightOn;
  internalLight.visible = backlightOn;
  stoneMat.emissiveIntensity = backlightOn ? 0.22 : 0.02;
  e.currentTarget.classList.toggle('active', backlightOn);
});

document.getElementById('btn-rotate').addEventListener('click', (e) => {
  controls.autoRotate = !controls.autoRotate;
  e.currentTarget.classList.toggle('active', controls.autoRotate);
});

document.getElementById('btn-wire').addEventListener('click', (e) => {
  stoneMat.wireframe = !stoneMat.wireframe;
  e.currentTarget.classList.toggle('active', stoneMat.wireframe);
});

document.getElementById('btn-reset').addEventListener('click', () => {
  controls.target.set(0, centerY, 0);
  camera.position.set(camDist * 0.72, centerY + camDist * 0.35, camDist * 0.92);
  controls.update();
});

document.getElementById('btn-fullscreen').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
