name: OnyxCompanion
options:
  bundleIdPrefix: com.onyx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    exactVersion: 0.18.0
targets:
  OnyxCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
      - Resources
    info:
      path: Resources/Info.plist
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onyx.companion
        PRODUCT_NAME: OnyxCompanion
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        ENABLE_BITCODE: NO
        UISUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
