<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Onyx.mx — Page Not Found</title>
  <link rel="icon" href="/onyx.mx/OnyxLogo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --main-color: #6BCEBB;
      --bg: #0a0a0f;
      --surface: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.9);
      --text-dim: rgba(255,255,255,0.35);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      overflow: hidden;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(107,206,187,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(0,174,239,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    .logo {
      width: 80px;
      height: 80px;
      opacity: 0.9;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    .code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, var(--main-color) 0%, #00AEEF 60%, rgba(107,206,187,0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .message {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 1.5rem 2.5rem;
      text-align: center;
      max-width: 400px;
      backdrop-filter: blur(20px);
    }

    .card p {
      color: var(--text-dim);
      font-size: 0.8125rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: rgba(107,206,187,0.15);
      border: 1px solid rgba(107,206,187,0.3);
      border-radius: 0.75rem;
      color: var(--main-color);
      font-size: 0.75rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(107,206,187,0.25);
      transform: translateY(-2px);
    }

    .redirect-notice {
      font-size: 0.7rem;
      color: rgba(107,206,187,0.6);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity:0.5; } 50% { opacity:1; } }

    .wordmark {
      font-size: 0.625rem;
      font-weight: 900;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <!-- Inline OnyxLogo SVG (no JS dependency) -->
  <svg class="logo" viewBox="0 0 2513 2928" xmlns="http://www.w3.org/2000/svg"
       style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2">

  </svg>

  <div>
    <div class="code">404</div>
    <div class="message">Page not found</div>
  </div>

  <div class="card">
    <p id="msg">This page doesn't exist. You may have followed an outdated link or mistyped the address.</p>
    <a class="btn" href="/onyx.mx/">↗ Go to Onyx.mx</a>
    <div class="wordmark" style="margin-top:1.25rem">Onyx.mx · Enterprise Platform</div>
  </div>

  <script>
    // ── Supabase auth redirect handler ──────────────────────────────────────
    // When Supabase sends a confirmation email it uses redirect_to pointing here.
    // The token arrives either in the URL hash (#access_token=...) or as query
    // params (?token=...&type=signup). Forward everything to the actual app so
    // App.tsx can pick it up and process the session.
    (function () {
      var APP_BASE = '/onyx.mx/';
      var hash   = window.location.hash;   // e.g. #access_token=...&type=signup
      var search = window.location.search; // e.g. ?token=...&type=signup

      var isAuthCallback =
        hash.includes('type=signup') ||
        hash.includes('type=recovery') ||
        hash.includes('access_token') ||
        search.includes('type=signup') ||
        search.includes('type=recovery') ||
        search.includes('token=');

      if (isAuthCallback) {
        document.getElementById('msg').textContent =
          'Account activation detected. Redirecting you to Onyx.mx…';
        document.querySelector('.btn').style.display = 'none';
        document.querySelector('.redirect-notice') &&
          (document.querySelector('.redirect-notice').style.display = 'block');

        // Preserve both hash and search params so the app can verify the token
        var target = APP_BASE + search + hash;
        setTimeout(function () {
          window.location.replace(target);
        }, 800);
      }
    })();
  </script>

</body>
</html>
