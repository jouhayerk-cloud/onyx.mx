  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: rgba(255,255,255,0.9);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%,  rgba(107,206,187,0.09) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(0,174,239,0.06)   0%, transparent 60%);
      pointer-events: none;
    }

    .logo {
      width: 96px;
      height: 96px;
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 28px rgba(107,206,187,0.3));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0);   }
      50%       { transform: translateY(-9px); }
    }

    .code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #6BCEBB 0%, #00AEEF 60%, rgba(107,206,187,0.4) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .message {
      font-size: 0.8125rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1.5rem;
      padding: 1.75rem 2.5rem;
      text-align: center;
      max-width: 420px;
      backdrop-filter: blur(20px);
    }
    .card p { color: rgba(255,255,255,0.38); font-size: 0.8125rem; line-height: 1.7; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background: rgba(107,206,187,0.12);
      border: 1px solid rgba(107,206,187,0.3);
      border-radius: 0.75rem;
      color: #6BCEBB;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(107,206,187,0.22);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(107,206,187,0.15);
    }

    .wordmark {
      margin-top: 1rem;
      font-size: 0.6rem;
      font-weight: 900;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.13);
    }

    .redirect-badge {
      display: none;
      margin-top: 1rem;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(107,206,187,0.7);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
  </style>
</head>

  <div style="text-align:center">
    <div class="code">404</div>
    <div class="message">Page not found</div>
  </div>

  <div class="card">
    <p id="msg">This page doesn't exist on Onyx.mx. You may have followed an outdated link or the address was mistyped.</p>
    <div class="redirect-badge" id="badge">⟳ Activating account — redirecting…</div>
    <a class="btn" id="cta" href="/onyx.mx/">↗ Open Onyx.mx</a>
    <div class="wordmark">Onyx.mx · Enterprise Platform</div>
  </div>

  <script>
    // Forward Supabase auth callbacks to the app with params intact
    (function () {
      var APP = '/onyx.mx/';
      var h = window.location.hash;
      var s = window.location.search;
      var isAuth =
        h.includes('type=signup')  || h.includes('type=recovery') ||
        h.includes('access_token') ||
        s.includes('type=signup')  || s.includes('type=recovery') ||
        s.includes('token=');
      if (isAuth) {
        document.getElementById('msg').textContent =
          'Account activation detected. You will be redirected to Onyx.mx in a moment.';
        document.getElementById('badge').style.display = 'block';
        document.getElementById('cta').style.display   = 'none';
        setTimeout(function () { window.location.replace(APP + s + h); }, 900);
      }
    })();
  </script>
